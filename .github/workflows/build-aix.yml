
name: Build NinjaCoreWebSocket AIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare extension source
        run: |
          mkdir -p src/com/ninjacore/websocket/images
          cp NinjaCoreWebSocket.java src/com/ninjacore/websocket/NinjaCoreWebSocket.java
          cp ninjacore.png src/com/ninjacore/websocket/images/ninjacore.png

      - name: Build AIX
        id: build
        uses: pavi2410/AIX-Action@main
        with:
          source-dir: src
          package-name: com.ninjacore.websocket
          appinventor-repo: mit-cml/appinventor-sources
          appinventor-branch: master

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: NinjaCoreWebSocket-AIX
          path: ${{ steps.build.outputs.extension-path }}
